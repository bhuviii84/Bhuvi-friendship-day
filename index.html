<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friendship Day Surprise for Bhuvi</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="floating-hearts" aria-hidden="true"></div>
      <div class="emoji-rain" aria-hidden="true"></div>
      <section class="hero-card page-card is-active" id="hero-page">
        <div class="badge">✨ Friendship Day Surprise</div>
        <h1>For <span id="friend-name-heading">Bhuvi</span>, my first friend and forever favorite.</h1>
        <p class="subtitle">
          A single magical page of friendship, split into sweet little moments. Tap next to walk through smiles, hearts, promises, and happy surprises made just for you.
        </p>
        <button class="primary-action next-page" type="button">🎁 Start the surprise</button>
      </section>

      <section class="story-stage" id="story-stage" aria-live="polite"></section>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
